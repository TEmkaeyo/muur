<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Урилга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#ece6ff; --ink:#231b4d; --soft:#5b5290; --yes:#ff4f7b; --yes-ink:#fff; --no:#fff; --no-ink:#231b4d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17123a; --ink:#f3efff; --soft:#b7aee8; --no:#2b2561; --no-ink:#f3efff;}
}
:root[data-theme="dark"]{--bg:#17123a; --ink:#f3efff; --soft:#b7aee8; --no:#2b2561; --no-ink:#f3efff;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  display:flex;overflow-y:auto;
}
main{width:min(100%,34rem);padding:1.25rem;margin:auto;text-align:center}
.emoji{font-size:4.5rem;line-height:1;display:block;margin-bottom:1rem}
h1{
  font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800;
  font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.15;margin:0 0 .75rem;
}
p{margin:0 auto 2rem;max-width:30ch;font-size:1.1rem;line-height:1.5;color:var(--soft);font-weight:600}
.row{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;min-height:6rem}
button{
  font:inherit;font-weight:800;border:0;border-radius:999px;cursor:pointer;
  padding:.9rem 1.8rem;transition:transform .15s ease;
}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:active{transform:scale(.96)}
#yes{background:var(--yes);color:var(--yes-ink);font-size:1.2rem;box-shadow:0 8px 24px rgba(255,79,123,.35)}
#no{background:var(--no);color:var(--no-ink);font-size:1rem;box-shadow:inset 0 0 0 2px var(--soft)}
#no[hidden]{display:none}
#cat{display:none;width:9rem;height:auto;margin:0 auto 1rem}
.sad #mail{display:none}
.sad #cat{display:block}
#cat.beg{animation:beg .5s ease}
@keyframes beg{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){#cat.beg{animation:none}}
#pick,#done{display:none}
.step2 #ask{display:none}
.step2 #pick{display:block}
.step3 #pick{display:none}
.step3 #done{display:block}
.q{font-weight:800;margin:0 0 .6rem;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin:0 0 1.5rem}
.chip{background:var(--no);color:var(--no-ink);font-size:.95rem;padding:.65rem 1.1rem;box-shadow:inset 0 0 0 2px var(--soft)}
.chip[aria-pressed="true"]{background:var(--yes);color:var(--yes-ink);box-shadow:none}
#go,#copy{background:var(--yes);color:var(--yes-ink);font-size:1.1rem}
#go:disabled{opacity:.4;cursor:not-allowed}
.sum{font-weight:800;font-size:1.15rem;line-height:1.6;margin:0 0 1.5rem}
.heart{position:fixed;bottom:-2rem;font-size:1.8rem;animation:rise 3.2s ease-in forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}button{transition:none}}
</style>
</head>
<body>
<main>
  <section id="ask">
    <span class="emoji" id="mail" aria-hidden="true">💌</span>
    <svg id="cat" viewBox="0 0 160 140" role="img" aria-label="Гуйж буй муур" xmlns="http://www.w3.org/2000/svg">
      <polygon points="28,52 36,6 72,32" fill="#f4a259"/>
      <polygon points="132,52 124,6 88,32" fill="#f4a259"/>
      <polygon points="38,40 41,20 56,32" fill="#ffb3c6"/>
      <polygon points="122,40 119,20 104,32" fill="#ffb3c6"/>
      <ellipse cx="80" cy="76" rx="58" ry="50" fill="#f4a259"/>
      <ellipse cx="40" cy="92" rx="10" ry="6" fill="#ff8fab" opacity=".5"/>
      <ellipse cx="120" cy="92" rx="10" ry="6" fill="#ff8fab" opacity=".5"/>
      <circle cx="56" cy="70" r="17" fill="#231b4d"/>
      <circle cx="104" cy="70" r="17" fill="#231b4d"/>
      <circle cx="50" cy="63" r="7" fill="#fff"/>
      <circle cx="98" cy="63" r="7" fill="#fff"/>
      <circle cx="62" cy="77" r="3.5" fill="#fff"/>
      <circle cx="110" cy="77" r="3.5" fill="#fff"/>
      <polygon points="74,90 86,90 80,98" fill="#ff4f7b"/>
      <path d="M80 98 Q73 107 66 102 M80 98 Q87 107 94 102" stroke="#231b4d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M30 86 L8 82 M30 94 L8 96 M130 86 L152 82 M130 94 L152 96" stroke="#231b4d" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="66" cy="124" rx="14" ry="11" fill="#f4a259" stroke="#d9822b" stroke-width="2"/>
      <ellipse cx="94" cy="124" rx="14" ry="11" fill="#f4a259" stroke="#d9822b" stroke-width="2"/>
    </svg>
    <h1>Надтай хамт кино үзэх үү?</h1>
    <p> i believe you </p>
    <div class="row">
      <button id="yes" type="button">Тиймээ</button>
      <button id="no" type="button">Үгүй</button>
    </div>
  </section>
  <section id="pick">
    <span class="emoji" aria-hidden="true">🥳</span>
    <h1>Мэдэж байсан!</h1>
    <p>Одоо цаг, газраа сонгоорой.</p>
    <div class="q">Хэзээ уулзах вэ?</div>
    <div class="chips">
      <button class="chip" type="button" data-g="time" aria-pressed="false">Баасан орой</button>
      <button class="chip" type="button" data-g="time" aria-pressed="false">Бямба өдөр</button>
      <button class="chip" type="button" data-g="time" aria-pressed="false">Ням өдөр</button>
      <button class="chip" type="button" data-g="time" aria-pressed="false">Өөр цаг, би хэлье</button>
    </div>
    <div class="q">Хаана уулзах вэ?</div>
    <div class="chips">
      <button class="chip" type="button" data-g="place" aria-pressed="false">Кофе шоп</button>
      <button class="chip" type="button" data-g="place" aria-pressed="false">Зоогийн газар</button>
      <button class="chip" type="button" data-g="place" aria-pressed="false">Кино театр</button>
      <button class="chip" type="button" data-g="place" aria-pressed="false">Алхах</button>
    </div>
    <button id="go" type="button" disabled>Баталгаажуулах</button>
  </section>
  <section id="done" aria-live="polite">
    <span class="emoji" aria-hidden="true">🧣</span>
    <h1>Дулаахан хувцаслаарай</h1>
    <div class="sum" id="sum"></div>
    <button id="copy" type="button">Сонголтоо хуулах</button>
  </section>
</main>
<script>
(function(){
  var yes=document.getElementById('yes'), no=document.getElementById('no');
  var phrases=["Үгүй","Нэг бодоорой","Үнэхээр үү?","Гуйя…","Сайн бодлоо биз?","Би хүлээж байна шүү","Сүүлчийн боломж!"];
  var n=0;
  no.addEventListener('click',function(){
    n++;
    document.body.classList.add('sad');
    var c=document.getElementById('cat'); c.classList.remove('beg'); void c.getBoundingClientRect(); c.classList.add('beg');
    var s=1+n*0.35;
    yes.style.fontSize=(1.2*s)+'rem';
    yes.style.padding=(.9*s)+'rem '+(1.8*s)+'rem';
    if(n>=phrases.length){ no.hidden=true; return; }
    no.textContent=phrases[n];
    no.style.fontSize=Math.max(.6,1-n*0.07)+'rem';
  });
  yes.addEventListener('click',function(){
    document.body.classList.add('step2');
    var h=['💖','💗','💘','💞','🌸'];
    for(var i=0;i<28;i++){
      var e=document.createElement('span');
      e.className='heart';
      e.textContent=h[i%h.length];
      e.style.left=(Math.random()*95)+'vw';
      e.style.animationDelay=(Math.random()*1.2)+'s';
      document.body.appendChild(e);
    }
  });
  var pick={time:null,place:null}, go=document.getElementById('go'), msg='';
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',function(){
      var g=c.getAttribute('data-g');
      document.querySelectorAll('.chip[data-g="'+g+'"]').forEach(function(x){x.setAttribute('aria-pressed','false');});
      c.setAttribute('aria-pressed','true');
      pick[g]=c.textContent;
      go.disabled=!(pick.time&&pick.place);
    });
  });
  go.addEventListener('click',function(){
    msg='Би явна! Цаг: '+pick.time+'. Газар: '+pick.place+'.';
    var s=document.getElementById('sum');
    s.innerHTML='';
    ['🕒 '+pick.time,'📍 '+pick.place].forEach(function(t){
      var d=document.createElement('div'); d.textContent=t; s.appendChild(d);
    });
    document.body.classList.remove('step2');
    document.body.classList.add('step3');
  });
  document.getElementById('copy').addEventListener('click',function(){
    var b=this;
    try{
      navigator.clipboard.writeText(msg).then(function(){b.textContent='Хуулсан ✓';},function(){b.textContent='Дэлгэцийн зургаа аваарай';});
    }catch(e){b.textContent='Дэлгэцийн зургаа аваарай';}
  });
})();
</script>
</body>
</html>
